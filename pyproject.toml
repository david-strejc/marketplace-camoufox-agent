[project]
name = "marketplace-camoufox-agent"
version = "0.1.0"
description = "Profile-isolated Camoufox workflows for Marketplace listings and consented lead intake"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Strejc" }]
dependencies = [
    "camoufox[geoip]>=0.5.0,<0.6",
    "filelock>=3.16,<4",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "phonenumbers>=8.13,<10",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
marketplace-agent = "marketplace_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S104"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["marketplace_agent"]
mypy_path = "src"

[tool.uv]
package = true
